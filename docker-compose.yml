# Stocky full stack. Postgres is pinned to 18 — DO NOT DOWNGRADE.
# Base images are multi-arch so this runs on a Raspberry Pi 4 (arm64).

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocky_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stocky}
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory under
      # /var/lib/postgresql (NOT .../data). Mounting the parent is the documented 18+
      # layout and keeps pg_upgrade --link working. Do not revert to .../data.
      - stocky_pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocky} -d ${POSTGRES_DB:-stocky}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        # Set by the Makefile (git describe / rev-parse); default when building bare.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_VERSION: ${GIT_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Same credential components as the db service; HOST points at the db container.
      POSTGRES_USER: ${POSTGRES_USER:-stocky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocky_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stocky}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    # Apply migrations, then start the API.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Browser-visible; points at the host-published backend port.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  stocky_pgdata:
