[project]
name = "stocky-backend"
version = "0.1.0"
description = "Stocky backend — classroom inventory management API"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.138",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "python-barcode>=0.15",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # Tests run against a real postgres:18 container — never SQLite. The schema and the
    # types (tz-aware timestamps, JSON, UUID) must match production exactly.
    "testcontainers>=4.8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection callables are meant to be used as argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Cookie",
    "fastapi.Query",
    "fastapi.Body",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
