<?xml version="1.0" encoding="UTF-8"?>
<!-- User ID card template, 3.375in x 2.125in CR80 (243pt x 153pt). Placeholders in {{...}} are
     filled by services/cards.py; rect#barcode-slot marks where the Code128 barcode is drawn. -->
<svg xmlns="http://www.w3.org/2000/svg" width="243" height="153" viewBox="0 0 243 153">
  <rect x="1.5" y="1.5" width="240" height="150" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="240" height="26" rx="10" fill="#1f6feb"/>
  <rect x="1.5" y="16" width="240" height="11.5" fill="#1f6feb"/>
  <text x="14" y="19" font-family="Helvetica" font-weight="bold" font-size="12" fill="#ffffff">STOCKY</text>
  <text x="229" y="19" text-anchor="end" font-family="Helvetica" font-size="9" fill="#dbe9ff">Library card</text>
  <text x="121.5" y="58" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="18" fill="#111111">{{title}}</text>
  <text x="121.5" y="78" text-anchor="middle" font-family="Helvetica" font-size="11" fill="#555555">{{subtitle}}</text>
  <rect id="barcode-slot" x="40" y="90" width="163" height="36" fill="none" stroke="none"/>
  <text x="121.5" y="143" text-anchor="middle" font-family="Helvetica" font-size="10" fill="#555555">{{barcode}}</text>
</svg>
