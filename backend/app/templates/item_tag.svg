<?xml version="1.0" encoding="UTF-8"?>
<!-- Item tag template, 50mm x 30mm (141.73pt x 85.04pt) die-cut label stock — no frame, the
     stock edge is the border. Barcode and name dominate. Placeholders in {{...}} are filled by
     services/cards.py; the rect#barcode-slot marks where the Code128 barcode is drawn. Keep the
     width/height/viewBox in sync with CardSpec ITEM_TAG in services/cards.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="141.73" height="85.04" viewBox="0 0 141.73 85.04">
  <text x="70.87" y="15" text-anchor="middle" font-family="Helvetica" font-weight="bold" font-size="13" fill="#111111">{{title}}</text>
  <text x="70.87" y="25.5" text-anchor="middle" font-family="Helvetica" font-size="7" fill="#555555">{{subtitle}} {{extra}}</text>
  <rect id="barcode-slot" x="6" y="29.5" width="129.73" height="42" fill="none" stroke="none"/>
  <text x="70.87" y="81" text-anchor="middle" font-family="Helvetica" font-size="8" fill="#333333">{{barcode}}</text>
</svg>
